{% extends 'mess/base.html' %}{% block content %}<div class="panel" style="max-width:760px"><h2>{{ title }}</h2><form method="post" enctype="multipart/form-data">{% csrf_token %}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="muted">{{ field.help_text }}</div>{% endif %}{% for error in field.errors %}<div class="negative">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn" type="submit">Save record</button> <a class="btn secondary" href="javascript:history.back()">Cancel</a></form></div>{% endblock %}
